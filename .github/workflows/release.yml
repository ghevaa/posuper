name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './apps/desktop/src-tauri -> target'

      - name: Install node dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build -w apps/web

      - name: Build and Release Tauri Desktop App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'POS Yoga ${{ github.ref_name }}'
          releaseBody: 'Pembaruan otomatis POS Yoga (Desktop & Android APK).'
          releaseDraft: false
          prerelease: false
          projectPath: apps/desktop

      - name: Sync Capacitor Android
        shell: pwsh
        run: |
          if (-not (Test-Path "android")) { npx cap add android }
          npx cap copy android
        working-directory: apps/web
        continue-on-error: true

      - name: Build Android APK
        shell: cmd
        run: gradlew.bat assembleDebug
        working-directory: apps/web/android
        continue-on-error: true

      - name: Upload Android APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
